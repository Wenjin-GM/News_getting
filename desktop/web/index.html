<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#234c3d"><meta name="description" content="一览，把新闻、热搜与社区讨论收进一页。数据保存在自己的电脑上。">
  <title>一览 · NewsDesk</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/ai.css">
</head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
<symbol id="i-source" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 8h4M7 12h10M7 16h10M15 8h2"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3L3 9.6l6.2-.9Z"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-14-2L3 9m0-6v6h6M4 16a8 8 0 0 0 14 2l3-3m0 6v-6h-6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M14 3h7v7M21 3 10 14"/><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
<symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3C9 2 3 7 4 14c1 6 9 8 13 2 2-3 3-8 3-13Z"/><path d="M4 21 16 8"/></symbol>
<symbol id="i-ai" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/><path d="m20 2 .5 1.5L22 4l-1.5.5L20 6l-.5-1.5L18 4l1.5-.5Z"/></symbol>
</defs></svg>
<div class="shell">
  <aside class="sidebar">
    <a href="#" class="brand" aria-label="一览首页"><span class="brand-mark">览<span></span></span><span class="brand-type">一览<small>NEWS DESK</small></span></a>
    <div class="sidebar-label">你的信息窗口</div>
    <nav class="nav" aria-label="主导航">
      <button class="nav-item active" data-view="overview"><svg><use href="#i-grid"/></svg>今日一览<span class="nav-dot"></span></button>
      <button class="nav-item" data-view="ai"><svg><use href="#i-ai"/></svg>AI 专栏<span class="nav-count ai-nav-tag">NEW</span></button>
      <button class="nav-item" data-view="sources"><svg><use href="#i-source"/></svg>信息来源<span id="nav-source-count" class="nav-count">—</span></button>
      <button class="nav-item" data-view="favorites"><svg><use href="#i-star"/></svg>我的收藏<span id="nav-fav-count" class="nav-count">0</span></button>
      <button class="nav-item" data-view="history"><svg><use href="#i-clock"/></svg>历史记录</button>
    </nav>
    <div class="sidebar-note"><span class="little-orbit"></span><p>多一点视角，<br>少一点信息噪声。</p><small>独立获取 · 本地保存</small></div>
    <div class="sidebar-bottom"><button data-action="phone"><svg><use href="#i-phone"/></svg>在手机上阅读<svg class="small"><use href="#i-arrow"/></svg></button><button data-action="help"><svg><use href="#i-info"/></svg>使用说明<span class="version">v1.1</span></button><div class="connection"><i id="connection-dot"></i><span id="connection-text">正在连接本地服务</span></div></div>
  </aside>
  <main>
    <header class="topbar"><div class="breadcrumb">我的新闻台<span>/</span><b id="page-crumb">今日一览</b></div><div class="topbar-right"><span id="today-date"></span><span class="topbar-divider"></span><span class="personal-avatar">览</span></div></header>
    <div class="workspace">
      <div id="connection-banner" class="connection-banner" hidden></div>
      <section class="page-heading"><div><div class="eyebrow" id="page-eyebrow">A LITTLE PERSPECTIVE, EVERY DAY</div><h1 id="page-title">把世界的动向，收进一页<span>。</span></h1><p id="page-description">新闻、热点与社区讨论，在这里相遇。</p></div><div class="heading-actions"><button class="button secondary icon-button" data-action="export" title="导出新闻快照" aria-label="导出新闻快照"><svg><use href="#i-download"/></svg></button><button id="refresh-button" class="button primary" data-action="refresh"><svg><use href="#i-refresh"/></svg><span>一键获取</span></button></div></section>
      <div id="refresh-progress" class="refresh-progress" hidden><div class="progress-label"><span id="progress-text">正在更新各个来源…</span><span id="progress-count"></span></div><div class="progress-track"><i id="progress-bar"></i></div></div>
      <div id="content"></div>
      <footer class="footer"><span><svg><use href="#i-leaf"/></svg>保持好奇，也保留判断。</span><span>内容来自各原始平台 · 点击标题阅读原文</span></footer>
    </div>
  </main>
</div>
<dialog id="modal"><div class="modal-heading"><div><span class="eyebrow" id="modal-eyebrow">NEWS DESK</span><h2 id="modal-title"></h2></div><button class="close-button" data-action="close-modal" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div><div id="modal-body"></div></dialog>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="/app.js" defer></script><script src="/ai.js" defer></script>
</body></html>
